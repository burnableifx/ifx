# ifxd --config ifxd.toml
# This remote-store example requires a SurrealDB server that ifxd can reach:
#   surreal start --user root --pass root --bind 127.0.0.1:8000 surrealkv://./ifx-data
db = "ws://127.0.0.1:8000"
listen = "127.0.0.1:7433"
check_interval = "30s"
drift_interval = "5m"

[[stacks]]
dir = "."
name = "default"
