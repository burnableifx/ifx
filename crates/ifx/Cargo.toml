[package]
name = "ifx"
description = "Infrastructure as a single reconciled graph: cloud resources and in-host configuration, planned and applied together."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[features]
default = ["host", "linode", "qemu"]
host = ["ifx-program/host"]
linode = ["ifx-program/linode"]
qemu = ["ifx-program/qemu"]

[dependencies]
ifx-program = { workspace = true, default-features = false }
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
async-trait.workspace = true
tokio.workspace = true
futures.workspace = true
fs2.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
sha2.workspace = true
hex.workspace = true
base64.workspace = true
shell-escape.workspace = true
reqwest.workspace = true
surrealdb.workspace = true
chrono.workspace = true
humantime-serde.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
wiremock.workspace = true
