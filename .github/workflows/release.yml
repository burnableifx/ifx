name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - { os: ubuntu-latest, target: x86_64-unknown-linux-gnu, suffix: linux-x86_64, ext: "" }
          - { os: macos-13, target: x86_64-apple-darwin, suffix: macos-x86_64, ext: "" }
          - { os: macos-latest, target: aarch64-apple-darwin, suffix: macos-aarch64, ext: "" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc, suffix: windows-x86_64, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          target: ${{ matrix.target }}
      - run: cargo build --release --locked --target ${{ matrix.target }} -p ifx-cli -p ifxd
      - uses: actions/upload-artifact@v4
        with:
          name: ifx-${{ matrix.suffix }}
          path: |
            target/${{ matrix.target }}/release/ifx${{ matrix.ext }}
            target/${{ matrix.target }}/release/ifxd${{ matrix.ext }}
